[package]
name = "carlector"
version = "0.1.0"
description = "Carlector, lector local asistido para documentos tecnicos"
authors = ["Emile Cid"]
edition = "2021"

[lib]
name = "carlector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
pulldown-cmark = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
ndarray = "0.17"
ndarray-npy = "0.10"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["UTType"] }
sayd-kokoro = "0.1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
