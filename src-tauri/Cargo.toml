[package]
name = "carlector"
version = "0.1.0"
description = "Carlector, lector local asistido para documentos tecnicos"
authors = ["Emile Cid"]
edition = "2021"

[lib]
name = "carlector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
kokoro-en = { version = "0.1.5", default-features = false, features = ["misaki-lean"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
